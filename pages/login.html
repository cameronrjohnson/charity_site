<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in or create a Charity Finder account.">
  <title>Log in | Charity Finder</title>
  <link rel="stylesheet" href="../css/wireframe.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">CF</span><span>Charity Finder</span></a><nav class="primary-nav" aria-label="Main navigation"><a href="../index.html">Home</a><a href="charities.html">Charities</a><a href="quiz.html">Take the quiz</a></nav><a class="login-link" href="login.html" aria-current="page">Log in</a></header>
  <main id="main" class="login-main">
    <section class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Your account</p>
      <h1 id="login-title">Welcome <span id="login-title-accent">back.</span></h1>
      <p class="login-intro" id="login-intro">Sign in to your account or create one to get started.</p>
      <form id="auth-form">
        <p class="auth-message" id="auth-message" role="status" aria-live="polite" hidden></p>
        <label class="field-label" for="auth-email">Email address</label>
        <input id="auth-email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        <label class="field-label" for="auth-password">Password</label>
        <input id="auth-password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" minlength="6" required>
        <button class="login-submit" id="auth-submit" type="submit">Log in</button>
      </form>
      <p class="login-signup" id="auth-toggle-text">New here? <button class="login-toggle-button" id="auth-toggle" type="button">Create account</button></p>
      <section class="signed-in-view" id="signed-in-view" aria-live="polite" hidden>
        <p>You’re signed in as <strong id="signed-in-email"></strong>.</p>
        <a class="text-link" href="profile.html">Your profile and saved charities</a>
        <button class="login-submit" id="auth-logout" type="button">Log out</button>
      </section>
    </section>
  </main>
  <footer class="site-footer"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">CF</span><span>Charity Finder</span></a><span>Account page concept</span></footer>
  <a class="chat-fab" href="chat.html" aria-label="Open AI chat" title="Open AI chat"><span class="chat-icon" aria-hidden="true"></span><span>AI chat</span></a>
  <script type="module" src="../js/auth.js"></script>
  <script type="module" src="../js/chat-widget.js"></script>
</body>
</html>
