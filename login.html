<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Static visual draft of the Charity Finder account sign-in page.">
  <title>Log in | Charity Finder</title>
  <link rel="stylesheet" href="css/wireframe.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">CF</span><span>Charity Finder</span></a><nav class="primary-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="charities.html">Charities</a><a href="quiz.html">Take the quiz</a></nav><a class="login-link" href="login.html" aria-current="page">Log in</a></header>
  <main id="main" class="login-main">
    <section class="login-panel" aria-labelledby="login-title">
      <p class="eyebrow">Your account</p>
      <h1 id="login-title">Welcome <span>back.</span></h1>
      <p class="login-intro">Sign-in screen draft for a future account experience.</p>
      <label class="field-label" for="email-preview">Email address</label>
      <input id="email-preview" type="email" placeholder="you@example.com" disabled>
      <label class="field-label" for="password-preview">Password</label>
      <input id="password-preview" type="password" placeholder="Enter your password" disabled>
      <button class="login-submit" type="button" disabled>Log in</button>
      <p class="draft-disclaimer">Authentication is not connected in this static draft.</p>
      <p class="login-signup">New here? <span>Create account (draft)</span></p>
    </section>
  </main>
  <footer class="site-footer"><a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">CF</span><span>Charity Finder</span></a><span>Account page concept</span></footer>
